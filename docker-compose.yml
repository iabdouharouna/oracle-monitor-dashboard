services:
  redis:
    image: redis:7-alpine
    container_name: oracle-monitor-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: oracle-monitor-backend
    environment:
      - ORACLE_USER=${ORACLE_USER:-monitor}
      - ORACLE_PASSWORD=${ORACLE_PASSWORD:-monitor}
      - ORACLE_DSN=oradb-free:1521/freepdb1
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - HAS_DIAGNOSTICS_PACK=true
      - DEBUG=false
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: '2G'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    command: celery -A app.celery_app worker -l INFO --concurrency=4
    environment:
      - ORACLE_USER=${ORACLE_USER:-monitor}
      - ORACLE_PASSWORD=${ORACLE_PASSWORD:-monitor}
      - ORACLE_DSN=oradb-free:1521/freepdb1
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - backend
      - redis
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: '1G'

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: oracle-monitor-celery-beat
    command: celery -A app.celery_app beat -l INFO --scheduler celery.beat.PersistentScheduler
    environment:
      - ORACLE_USER=${ORACLE_USER:-monitor}
      - ORACLE_PASSWORD=${ORACLE_PASSWORD:-monitor}
      - ORACLE_DSN=oradb-free:1521/freepdb1
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - backend
      - redis
    volumes:
      - celery_beat_data:/app/celerybeat-schedule

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: oracle-monitor-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: oracle-monitor-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

  grafana:
    image: grafana/grafana:10.2.0
    container_name: oracle-monitor-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  redis_data:
  celery_beat_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: oracle-monitor-network
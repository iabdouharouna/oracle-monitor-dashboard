name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===========================================
  # Backend Tests
  # ===========================================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      oracle:
        image: gvenzl/oracle-free:23-slim
        env:
          ORACLE_PASSWORD: oracle
          ORACLE_DATABASE: FREE
        ports:
          - 1521:1521
        options: >-
          --health-cmd="sqlplus -L sys/oracle@//localhost:1521/FREE as sysdba @/opt/oracle/scripts/startup/healthcheck.sql || exit 1"
          --health-interval=30s
          --health-timeout=10s
          --health-retries=5
          --health-start-period=60s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=3s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --all-extras

      - name: Wait for Oracle
        run: |
          for i in {1..30}; do
            if docker exec oracle-monitor-db sqlplus -L sys/oracle@//localhost:1521/FREE as sysdba @/opt/oracle/scripts/startup/healthcheck.sql 2>/dev/null; then
              echo "Oracle is ready"
              break
            fi
            sleep 5
          done

      - name: Run backend tests
        working-directory: ./backend
        env:
          ORACLE_USER: monitor
          ORACLE_PASSWORD: monitor
          ORACLE_DSN: localhost:1521/FREE
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-testing-purposes-only-32chars
          HAS_DIAGNOSTICS_PACK: "true"
          DEBUG: "true"
        run: |
          uv run pytest -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage

      - name: Run linting
        working-directory: ./backend
        run: uv run ruff check .

      - name: Check formatting
        working-directory: ./backend
        run: uv run ruff format --check .

  # ===========================================
  # Frontend Tests
  # ===========================================
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run linting
        working-directory: ./frontend
        run: npm run lint

      - name: Check formatting
        working-directory: ./frontend
        run: npm run format -- --check

      - name: Run type checking
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Run unit tests
        working-directory: ./frontend
        run: npm run test:run -- --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage

      - name: Run E2E tests
        working-directory: ./frontend
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

  # ===========================================
  # Docker Build Test
  # ===========================================
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-test, frontend-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: production
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: production
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test backend container
        run: |
          docker run -d --name backend-test \
            -e ORACLE_USER=monitor \
            -e ORACLE_PASSWORD=test \
            -e ORACLE_DSN=localhost:1521/FREE \
            -e REDIS_URL=redis://redis:6379/0 \
            -e SECRET_KEY=test-secret-key-for-testing-purposes-only-32chars \
            -e DEBUG=false \
            -p 8000:8000 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:test

          sleep 10
          curl -f http://localhost:8000/health || (docker logs backend-test && exit 1)
          docker stop backend-test

      - name: Test frontend container
        run: |
          docker run -d --name frontend-test \
            -p 3000:80 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:test

          sleep 5
          curl -f http://localhost:3000/health || (docker logs frontend-test && exit 1)
          docker stop frontend-test

  # ===========================================
  # Integration Test (Full Stack)
  # ===========================================
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-test, frontend-test]

    services:
      oracle:
        image: gvenzl/oracle-free:23-slim
        env:
          ORACLE_PASSWORD: oracle
          ORACLE_DATABASE: FREE
        ports:
          - 1521:1521
        options: >-
          --health-cmd="sqlplus -L sys/oracle@//localhost:1521/FREE as sysdba @/opt/oracle/scripts/startup/healthcheck.sql || exit 1"
          --health-interval=30s
          --health-timeout=10s
          --health-retries=5
          --health-start-period=60s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Start full stack
        run: |
          docker-compose -f docker-compose.yml -f docker-compose.override.yml up -d --build

      - name: Wait for services
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:8000/health > /dev/null && curl -sf http://localhost:3000/health > /dev/null; then
              echo "All services ready"
              break
            fi
            echo "Waiting for services... ($i/60)"
            sleep 5
          done

      - name: Run API integration tests
        working-directory: ./backend
        env:
          ORACLE_USER: monitor
          ORACLE_PASSWORD: monitor
          ORACLE_DSN: localhost:1521/FREE
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-testing-purposes-only-32chars
          HAS_DIAGNOSTICS_PACK: "true"
        run: |
          uv run pytest tests/integration/ -v

      - name: Run E2E tests
        working-directory: ./frontend
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Cleanup
        if: always()
        run: docker-compose -f docker-compose.yml -f docker-compose.override.yml down -v

  # ===========================================
  # Release
  # ===========================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-test, frontend-test, docker-build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ steps.version.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ steps.version.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false